name: ci

# The premise of this repository is that the documentation is the product, and
# that its claims about itself are checkable rather than aspirational. Every job
# here is also a `make` target, so what CI runs and what a contributor runs
# locally cannot diverge.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: content holds together
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile

      # No em dashes, no emoji, and the project name is never shortened to
      # "Apogee", which belongs to Apogee Components in this hobby.
      - name: Prose rules hold
        run: make prose

      # Part, tier and glossary cross-references resolve, frontmatter is
      # complete, and the accuracy contract holds: a null price carries a
      # verification marker, and no page claims verified while markers remain.
      - name: Data cross-references resolve
        run: make data

      # Anchors, not just paths. A build checkpoint that sends a stuck builder to
      # a troubleshooting symptom has to land on that symptom.
      - name: Internal links and anchors resolve
        run: make links

      # The block diagram is generated from the same data as the parts table. A
      # diagram maintained by hand disagrees with the hardware within a month,
      # and nobody notices until a builder follows it.
      - name: Schematic matches the hardware
        run: make check-schematic

  firmware:
    name: firmware core builds and passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # Nothing to install but cmake and a compiler, both already on the runner.
      # The core is deliberately free of the Pico SDK so it can be built and
      # tested on a laptop, which is the only way any of it can be verified
      # while no board exists.
      - run: make fw-build
      - run: make fw-test

      # The passive boundary and the no-invented-numbers rule, checked rather
      # than promised.
      - run: make fw-check

      # The C encoder and the TypeScript one must produce identical bytes. They
      # were written from the same specification by different hands, so a
      # difference is a defect in the document rather than in either of them.
      - run: make crossimpl

  hardware:
    name: schematic matches the circuit source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # The tscircuit CLI runs under bun. Under node it cannot load a .tsx entry
      # point at all, and the error it gives says nothing about bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Installed here rather than at the root: tscircuit at the root rehoists
      # the workspace and moves next out of where eslint expects to find it.
      - run: make hw-deps

      # The committed schematic and netlist are rendered from hardware/. If they
      # stop matching, the published drawing is describing a board that no longer
      # exists, which is the failure a generated schematic exists to prevent.
      - run: make check-hw

  web:
    name: site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: make lint
      - run: make type-check

      # The TypeScript half of the packet spec. These guard the independent
      # implementation that make crossimpl compares the firmware against, and
      # for a long time they ran only on somebody's laptop: `make check` invoked
      # them, CI did not, and the Makefile called itself "everything CI runs".
      - run: make test

      - run: make build

      # Drives a real browser at 320px and 390px and measures the real layout.
      # A flex item does not shrink below its content, so one wide diagram used
      # to push every page sideways while every other check stayed green.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: No page scrolls sideways on a phone
        run: make responsive
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      # The viewer has broken three times in ways every other check passed
      # through: a detached SVG node, a drawing framed outside its own viewBox,
      # and a NaN viewBox from fitting to a hidden tab. Only driving it finds
      # those.
      - name: Every drawing pans and zooms
        run: make viewers
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
