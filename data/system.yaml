# oApogee system block diagram
#
# The structure of the schematic, as data. tools/gen-schematic.mjs renders it to
# an SVG that is checked in and regenerated by `make schematic`, and CI fails if
# the committed file no longer matches this source.
#
# Generated rather than drawn, for the same reason the bill of materials is not
# a hand-written table: a diagram maintained by hand disagrees with the hardware
# within a month, and nobody notices until a builder follows it. Every node here
# names a part id from data/bom.yaml, and check-data fails if one stops
# resolving, so a part cannot be renamed or removed without the diagram noticing.
#
# The layout is a grid. Sensors on the left, the microcontroller in the middle,
# everything the flight produces on the right, and the power chain along the
# bottom, because that is the order in which someone reads a system they are
# deciding whether to build.

schema_version: 1
updated: 2026-08-11
status: draft

title: oApogee system
subtitle: One board, three tiers. Unpopulated footprints are the upgrade path.

# Grid geometry, in cells. The generator maps these to pixels.
grid:
  cols: 5
  rows: 5

nodes:
  # --- sensing, left -------------------------------------------------------
  - id: baro
    part: baro
    label: Barometer
    sub: BMP390
    col: 0
    row: 0
    tiers: [solo, link, track]
    note: Altitude

  - id: imu
    part: imu
    label: 6-axis IMU
    sub: ICM-42688-P
    col: 0
    row: 1
    tiers: [solo, link, track]
    note: Orientation

  - id: high_g
    part: high_g
    label: High-g accel
    sub: ADXL375
    col: 0
    row: 2
    tiers: [link, track]
    optional: true
    note: Unsaturated boost

  - id: gnss
    part: gnss
    label: GNSS
    sub: MAX-M10S
    col: 0
    row: 3
    tiers: [track]
    note: Recovery position

  # --- compute, middle -----------------------------------------------------
  - id: mcu
    part: mcu
    also: [mcu_module]
    label: RP2350
    sub: State machine, fusion
    col: 2
    row: 1
    tiers: [solo, link, track]
    emphasis: true
    note: Drag-and-drop UF2

  - id: flash
    part: flash
    label: QSPI flash
    sub: LittleFS, soldered down
    col: 2
    row: 3
    tiers: [solo, link, track]
    note: No card to unseat

  # --- outputs, right ------------------------------------------------------
  - id: lora
    part: lora
    also: [lora_module, antenna_rocket]
    label: LoRa radio
    sub: SX1262, 902-928 MHz
    col: 3
    row: 0
    tiers: [link, track]

  - id: ground
    part: null
    label: Ground station
    sub: Live telemetry in browser
    col: 4
    row: 0
    tiers: [link, track]
    external: true

  - id: recovery
    part: buzzer
    also: [status_led]
    label: Buzzer and LED
    sub: Arm state, beacon
    col: 3
    row: 2
    tiers: [solo, link, track]

  # --- power and the ground side, bottom -----------------------------------
  # USB-C is one physical connector doing four jobs, so it is drawn once, at the
  # head of the power chain, with the offload path arriving at it from the
  # microcontroller. Drawing it twice would be tidier and would misrepresent the
  # board.
  - id: usb
    part: usb_connector
    label: USB-C
    sub: Power, config, offload
    col: 0
    row: 4
    tiers: [solo, link, track]
    note: CSV and JSON out

  - id: charger
    part: charger
    label: Charger
    sub: MCP73831
    col: 1
    row: 4
    tiers: [solo, link, track]

  - id: cell
    part: battery
    also: [battery_connector]
    label: 1S LiPo
    sub: Protected cell
    col: 2
    row: 4
    tiers: [solo, link, track]

  - id: regulator
    part: regulator
    label: 3V3 rail
    sub: Buck-boost
    col: 3
    row: 4
    tiers: [solo, link, track]

edges:
  # Sensor buses into the microcontroller. The bus each part sits on is a design
  # decision, not a measurement: the high rate parts get SPI so the sample rate
  # is not limited by the bus, and the receiver that speaks NMEA gets a UART.
  # jog separates the vertical runs. Left at the default they would stack on one
  # x and read as a single shared bus, which would be a lie: these are four
  # parts on three different buses.
  - { from: baro, to: mcu, kind: bus, label: I2C, jog: 0.34 }
  - { from: imu, to: mcu, kind: bus, label: SPI }
  - { from: high_g, to: mcu, kind: bus, label: SPI, jog: 0.54 }
  - { from: gnss, to: mcu, kind: bus, label: UART, jog: 0.72 }

  # What the flight produces. Three edges share the gutter to the right of the
  # microcontroller, so they are spread across it rather than drawn on top of
  # one another.
  - { from: mcu, to: flash, kind: data, label: QSPI }
  - { from: mcu, to: lora, kind: data, label: SPI, jog: 0.28 }
  - { from: lora, to: ground, kind: rf, label: downlink }
  - { from: mcu, to: recovery, kind: data, label: GPIO, jog: 0.72 }
  # jog places the vertical run in the gutter beside the sensor column instead
  # of straight through the charger, and to_port lifts the arrival above the
  # centre of the USB-C box so it does not run back along the 5V power edge that
  # leaves the same side.
  - { from: mcu, to: usb, kind: data, label: offload, jog: 0.86, to_port: -17 }

  # Power. Drawn along the bottom in the order it actually flows.
  - { from: usb, to: charger, kind: power, label: 5V }
  - { from: charger, to: cell, kind: power }
  - { from: cell, to: regulator, kind: power }
  - { from: regulator, to: mcu, kind: power, label: 3V3 }

# Rendered under the diagram. Short, because a legend that needs reading twice
# has failed.
legend:
  - { kind: bus, label: Sensor bus }
  - { kind: data, label: Data }
  - { kind: rf, label: Radio link }
  - { kind: power, label: Power }

footnote: >
  Passive instrumentation only. Nothing on this diagram connects to an ejection
  charge, a deployment mechanism, or an igniter, and there is no output that
  could.
