  - id: regulator
    role: power
    name: Buck-boost regulator, fixed 3V3
    manufacturer: Texas Instruments
    mpn: TPS63001
    confidence: asserted
    designators: [U2]
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): price and weigh with the rest of the board. The electrical
      selection is settled and sourced; what is not settled is whether 800 mA is
      generous or merely adequate, because the payload's current draw in each
      flight state has never been measured. That measurement is on the battery
      entry and it decides nothing here unless it comes out surprisingly high.
    datasheet:
      document: SLVS520C, March 2006, revised October 2015
      url: https://www.ti.com/lit/ds/symlink/tps63001.pdf
      checked: 2026-08-15
      facts: >
        Input 1.8 V to 5.5 V, which spans a single lithium cell from full charge
        to cutoff. Fixed 3.3 V output, so no feedback divider and no resistor
        pair to get wrong. Up to 800 mA. Quiescent current 40 uA typical and
        50 uA maximum at no load with VIN 3.6 V and VOUT 3.3 V. VSON-10,
        3.00 by 3.00 mm, exposed pad connected to PGND. Needs one external
        2.2 uH inductor.
    applies:
      - { tier: solo, path: board, qty: 1 }
      - { tier: link, path: board, qty: 1 }
      - { tier: track, path: board, qty: 1 }
    why: >
      A single lithium cell runs from about 4.2 V down to about 3.0 V, and 3.3 V
      sits inside that range rather than below it. A plain buck browns out at the
      bottom of the discharge and a plain boost cannot help at the top, so the
      rail has to be buck-boost or the payload stops early with charge left in
      the cell. The fixed-output part was chosen over the adjustable one because
      a feedback divider is two more parts and one more way to be quietly wrong
      about a rail voltage.

      Quiescent current matters more here than efficiency at load. A payload
      spends its life on a pad and then in a field beeping, both at almost no
      draw, so 40 uA of standing loss is the number that decides how long it
      keeps beeping.
    substitutes:
