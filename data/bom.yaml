      TODO(verify): confirm the inductance and saturation current against the
      RP2350 datasheet's recommended values for the internal core regulator, and
      confirm the saturation current exceeds the peak switch current the
      regulator draws at full load. An inductor that saturates does not fail
      obviously: it just stops being an inductor at the current that matters.
    applies:
