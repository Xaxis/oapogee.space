      - { tier: track, path: board, qty: 1 }
    why: >
      Sets the charge controller's current. This is the one passive whose value
      is a real decision rather than a standard one, and it is the reason the
      charger row and the cell row cannot be settled independently.
    substitutes: []

  - id: res_4k7
    role: passive
    name: Resistor, 4.7k, 0402
    manufacturer: null
    mpn: null
    confidence: unverified
    designators: [R4, R5]
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): confirm the value against the bus capacitance of the actual
      layout and the barometer's drive strength, rather than taking a common
      value as correct.
    applies:
      - { tier: solo, path: board, qty: 2 }
      - { tier: link, path: board, qty: 2 }
      - { tier: track, path: board, qty: 2 }
    why: >
      The I2C pull-ups, and there is exactly one pair on the bus. Only the
      barometer sits on I2C; the high rate parts are on SPI so the sample rate is
      not limited by the bus. On the Modules path the breakout brings its own
      pair, which is why this row is Board only and why the build guide has you
      count them.
