  # --- Arming -------------------------------------------------------------

  - id: arm_switch
    role: arming
    name: Slide switch, SPDT, surface mount
    manufacturer: C&K
    mpn: JS102011SCQN
    confidence: asserted
    designators: [SW1]
    price_usd: null
    mass_g: null
    verify: >
      TODO(confirm-on-hardware): a slide switch is the one part on this board
      that can be moved by the flight rather than by the operator. Shake the
      built payload on all three axes and drop it from waist height onto
      carpet, and confirm the switch is in the position you left it in. If it
      is not, the answer is a detent cover or a screw switch, not a note in the
      manual.
    datasheet:
      document: C&K JS series slide switches
      url: https://www.ckswitches.com/media/1422/js.pdf
      checked: 2026-08-15
      facts: >
        SPDT, surface mount, three terminals. Terminal 2 is the common; the
        C&K legend reads "C: COMMON PIN". Rated 0.3 A at 6 VDC for 5,000 make
        and break cycles, or 0.1 A at 30 VDC for 15,000. Contact resistance
        70 milliohm maximum.

        The recommended land pattern has exactly three pads, staggered across
        two rows rather than in a line, and no mounting or shield lands: the
        housing and actuator are nylon and the only metal reaching the board is
        the three brass terminals.

        Those cycle figures are far lower than a slide switch of this size is
        usually assumed to manage, and the reason they do not bind here is that
        this switch carries no power. It pulls a logic input to ground. A switch
        in the battery path would have to carry the payload's full current
        including inrush into the bulk capacitance, and the datasheet publishes
        no inrush or surge rating at all.
    applies:
      - { tier: solo, path: board, qty: 1 }
      - { tier: link, path: board, qty: 1 }
      - { tier: track, path: board, qty: 1 }
      - { tier: solo, path: modules, qty: 1 }
      - { tier: link, path: modules, qty: 1 }
      - { tier: track, path: modules, qty: 1 }
    why: >
      The flight state machine's first transition is operator-driven, and
      without an input there is no flight: arming is what starts the pressure
      reference settling and the pre-arm ring buffer. It sits on a GPIO rather
      than in the power path, because oApogee is passive, so cutting power arms
      nothing and protects nobody. What the operator needs is to power the
      payload up, let the GNSS get a fix and the barometer settle, and then arm
      it once the rocket is on the rail, which a power switch cannot express.

      Mechanical rather than magnetic. The sealed-enclosure argument for a reed
      or Hall sensor does not survive contact with this design, because the pod
      is deliberately vented: it has static ports cut through it and must have.
      That leaves a magnetic switch trading an inspectable state for one
      anything magnetic in a range box can change, and arm state is exactly
      what an operator has to confirm by eye at the pad. A slide switch shows
      its position from across a table.

      SPDT rather than SPST, and only one throw is wired. The common pin goes
      to the GPIO, one throw goes to ground, and the other is left open so the
      internal pull-up defines the pin. Driving the spare throw to 3V3 would
      look tidier and give a defined level in both positions, but a slide
      switch is open for a moment as the wiper crosses, so the pin would float
      briefly on every throw and the firmware would have to debounce a state it
      could otherwise trust.

