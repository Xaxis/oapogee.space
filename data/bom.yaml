  - id: charger
    role: power
    name: LiPo charge controller
    manufacturer: Microchip
    mpn: MCP73831
    confidence: asserted
    designators: [U1]
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): set the charge current programming resistor from the chosen
      cell capacity and state the resulting rate, and confirm thermal behaviour
      in the pod, which is a small sealed plastic volume.
    applies:
      - { tier: solo, path: board, qty: 1 }
      - { tier: link, path: board, qty: 1 }
      - { tier: track, path: board, qty: 1 }
    why: >
      USB-C in, charge and run from the same connector, nothing to remove from
      the airframe to top the battery up between flights.
    substitutes:
      - mpn: BQ24074
        manufacturer: Texas Instruments
        note: >
          Adds proper power path management, so the payload runs from USB rather
          than from the cell while charging. Better behaviour on the bench during
          a long configuration session. More expensive and larger.
        confidence: asserted

  - id: regulator
    role: power
    name: 3V3 regulator
    manufacturer: null
    mpn: null
    confidence: unverified
    designators: [U2]
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): a single LiPo cell runs from about 4.2 V down to about 3.0 V,
      which crosses 3.3 V partway through. A plain buck regulator browns out at
      the bottom of the discharge and a plain LDO wastes headroom at the top, so
      the part is a buck-boost. Select one, then measure quiescent current,
      because on a payload that sits armed on a pad and then beacons after
      landing, idle draw sets endurance more than active draw does.
    applies:
      - { tier: solo, path: board, qty: 1 }
      - { tier: link, path: board, qty: 1 }
      - { tier: track, path: board, qty: 1 }
    why: >
      The rail everything else runs from. It is called out separately rather
      than hidden inside the microcontroller row because the choice between
      buck, boost, and buck-boost is decided by the cell chemistry, and getting
      it wrong shows up as a payload that dies at 60 percent battery.
    substitutes: []

  - id: usb_connector
    role: connector
    name: USB-C receptacle
    manufacturer: null
    mpn: null
    confidence: unverified
    designators: [J1]
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): choose a specific receptacle with through-hole mounting tabs.
      Surface-mount-only USB connectors tear off boards, and this one gets
      handled every flight day.
    applies:
      - { tier: solo, path: board, qty: 1 }
      - { tier: link, path: board, qty: 1 }
      - { tier: track, path: board, qty: 1 }
    why: >
      One connector for power, charging, configuration, and data offload. No
      programming header, no card slot, no second cable to lose.
    substitutes: []

  - id: battery_connector
    role: connector
    name: JST-PH 2.0 mm right-angle header, 2 position
    manufacturer: JST
    mpn: S2B-PH-K-S
    confidence: asserted
    designators: [J2]
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): confirm the cell's connector polarity matches. LiPo cells
      ship with both polarities and reversing one destroys the board. State the
      check explicitly in the build guide.
    applies:
      - { tier: solo, path: board, qty: 1 }
      - { tier: link, path: board, qty: 1 }
      - { tier: track, path: board, qty: 1 }
