    role: battery
    name: 1S LiPo cell with protection circuit, 150 to 250 mAh
    manufacturer: multiple
    mpn: null
    confidence: unverified
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): measure the actual current draw of each tier in each flight
      state, then size the cell from that rather than from the brief's assumed
      range. Report endurance as pad-idle hours plus post-landing beacon hours,
      because those are the two numbers a flier needs. Confirm the cell ships
