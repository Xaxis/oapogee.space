# ---------------------------------------------------------------------------
# Parts.
#
# Field reference:
#   id            stable slug, referenced by build steps and troubleshooting
#   role          functional role, one per role per build
#   mpn           manufacturer part number. Asserted only where confident.
#   confidence    asserted | unverified
#   applies       list of {tier, path, qty}. Absence means not used in that combo.
#   why           the design reasoning, rendered as the part's explainer
#   substitutes   documented alternates, with what changes if you use them
# ---------------------------------------------------------------------------

parts:
  # --- Compute ------------------------------------------------------------

  - id: mcu
    role: mcu
    name: RP2350 microcontroller
    manufacturer: Raspberry Pi
    mpn: RP2350A
    confidence: asserted
    designators: [U3]
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): unit price at qty 1 and qty 100 from an authorised
      distributor, and confirm the package variant (RP2350A is the 30-GPIO QFN-60
      part; RP2350B has more IO in a larger package and is not needed here).
    applies:
      - { tier: solo, path: board, qty: 1 }
      - { tier: link, path: board, qty: 1 }
      - { tier: track, path: board, qty: 1 }
    why: >
      Drag-and-drop UF2 flashing means a beginner installs no toolchain to get a
      working payload: the board appears as a USB drive and you copy a file onto
      it. That single property removes the most common place a first-time
      builder gives up. Beyond that, the part is cheap, the community is large,
      and the PIO blocks give clean timing-critical IO without burning CPU.
    substitutes:
      - mpn: RP2040
        note: >
          Fully acceptable. Loses the RP2350's hardware floating point, so the
          sensor fusion runs slower, and loses the security features, which this
          project does not use. Choose RP2040 if it is cheaper or more available
          at the time of the build.
        confidence: asserted

  - id: mcu_module
    role: mcu
    name: RP2350 or RP2040 development module
    manufacturer: multiple
    mpn: null
    confidence: unverified
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): select one canonical module and one alternate. Candidates to
      evaluate, none confirmed: Raspberry Pi Pico 2, Seeed XIAO RP2350, Adafruit
      Feather RP2040. Selection criteria in priority order: mass, whether the
      castellated or through-hole footprint suits a beginner, whether onboard
      QSPI flash is accessible to LittleFS, presence of a LiPo charger, and
      USB-C rather than micro-B. Weigh each candidate before choosing.
    applies:
      - { tier: solo, path: modules, qty: 1 }
      - { tier: link, path: modules, qty: 1 }
      - { tier: track, path: modules, qty: 1 }
    why: >
      The Modules path needs a carrier that already solves USB, the 3V3 rail, and
      the boot button, so the builder's soldering is limited to sensor
      connections.
    substitutes: []

  - id: flash
    role: storage
    name: QSPI NOR flash
    manufacturer: Winbond
    mpn: W25Q128JVSIQ
    confidence: asserted
    designators: [U4]
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): confirm the density actually required by measuring a full
      flight log at the intended sample rates, then size the part to that with
      margin rather than defaulting to 16 MB. Also confirm the specific part
      suffix, which encodes package and voltage.
    applies:
      - { tier: solo, path: board, qty: 1 }
      - { tier: link, path: board, qty: 1 }
      - { tier: track, path: board, qty: 1 }
    why: >
      Onboard flash with LittleFS, soldered down. There is no microSD socket on
      this design and that is a deliberate decision, not an omission. A microSD
      card is held in its socket by a friction detent, and boost acceleration on
      even a modest motor is enough to unseat one. In DIY flight computers the
      card socket is the single most common in-flight failure point, and its
      failure mode is the worst one available: the flight proceeds normally and
      the data is simply gone. A soldered part cannot unseat. The cost is that
      offloading data requires plugging in USB rather than moving a card, which
      is a mild inconvenience on the ground in exchange for removing a failure
      mode in the air.
    substitutes: []

  # --- Sensing ------------------------------------------------------------

  - id: baro
    role: barometer
    name: BMP390 barometric pressure sensor
    manufacturer: Bosch Sensortec
    mpn: BMP390
    confidence: asserted
    designators: [U5]
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): quote the RMS noise in Pa at the oversampling and output
      data rate oApogee actually configures, from the datasheet, and convert it
      to metres of altitude noise at sea level. Do not quote the headline
      "0.5 m" style figure from marketing material without stating the
      configuration it assumes. Also state the usable pressure range and what
      altitude that corresponds to.
    applies:
      - { tier: solo, path: board, qty: 1 }
      - { tier: link, path: board, qty: 1 }
      - { tier: track, path: board, qty: 1 }
      - { tier: solo, path: modules, qty: 1 }
      - { tier: link, path: modules, qty: 1 }
      - { tier: track, path: modules, qty: 1 }
    why: >
      Altitude is the number this entire project exists to produce, so the
      barometer is the one part not to economise on. Resolution here sets the
      resolution of the apogee figure.
    substitutes:
      - mpn: DPS310
        manufacturer: Infineon
        note: >
          The budget alternate. Cheaper and widely available. Document the
          resolution difference and the altitude ceiling of each part side by
          side so a builder choosing DPS310 knows precisely what they gave up.
          TODO(verify): produce that comparison from both datasheets.
        confidence: asserted
    breakout:
      supplier: Adafruit
      product: Adafruit BMP390, product 4816
      url: https://www.adafruit.com/product/4816
      confidence: asserted
      checked: 2026-08-13
      note: >
        Carries a regulator and level shifting, so it runs from 3V or 5V logic
        without thought, and brings STEMMA QT connectors. It also brings its own
        I2C pull-ups, which is the pair the build guide has you count.
      verify: >
        TODO(verify): price, mass, and whether those pull-ups duplicate a pair
        already fitted on the carrier. The barometer is the only part on the I2C
        bus, so the failure to look for is a second pair, not several. The
        product exists and is stocked; none of those numbers is measured.

  - id: imu
    role: imu
    name: 6-axis IMU, accelerometer and gyroscope
    manufacturer: TDK InvenSense
    mpn: ICM-42688-P
    confidence: asserted
    designators: [U6]
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): confirm the selectable full-scale ranges and the gyro noise
      density from the datasheet, and state which range oApogee configures.
    applies:
      - { tier: solo, path: board, qty: 1 }
      - { tier: link, path: board, qty: 1 }
      - { tier: track, path: board, qty: 1 }
      - { tier: solo, path: modules, qty: 1 }
      - { tier: link, path: modules, qty: 1 }
      - { tier: track, path: modules, qty: 1 }
    why: >
      Orientation, and the vertical acceleration channel that the sensor fusion
      integrates to cover for the barometer during the pressure disturbance
      around burnout and, on faster flights, transonic effects.
    substitutes:
      - mpn: LSM6DSO
        recommended_for: modules
        manufacturer: STMicroelectronics
        note: >
          Equivalent for this application, and the part to buy on the Modules
          path. Adafruit sells an LSM6DSOX breakout with STEMMA QT connectors,
          product 4517, checked 2026-08-13, which is assembled, documented, and
          easy to connect. Register maps differ from the ICM-42688-P, so the
          firmware carries a driver for each and choosing this costs a line of
          configuration rather than a redesign.
        url: https://www.adafruit.com/product/4517
        confidence: asserted
    availability: >
      Buyable as a chip and awkward as a breakout. Searched 2026-08-13: neither
      Adafruit nor SparkFun sells an ICM-42688-P breakout, and the only
      assembled board either carries is a MikroElektronika Click. That does not
      affect the Board path, where the chip is soldered directly. It decides the
      Modules path, where you need something already assembled, and it is why
      the substitute below is the recommendation there rather than a fallback.
    breakout:
      supplier: SparkFun
      product: MIKROE 6DOF IMU 14 Click, SEN-18783
      url: https://www.sparkfun.com/mikroe-6dof-imu-14-click-sen-18783.html
      confidence: asserted
      checked: 2026-08-13
      note: >
        Click format rather than Qwiic or STEMMA, so it plugs into nothing on
        this build and every connection is wired by hand. Buildable, and not what
        a first build should be sent after.
      verify: >
        TODO(verify): confirm the Click board exposes SPI and a usable chip
        select, because the Board path puts this part on SPI and a Modules build
        that could only reach it over I2C would mean the two paths no longer
        share one electrical design.

  - id: high_g
    role: high_g_accelerometer
    name: High-g accelerometer
    manufacturer: Analog Devices
    mpn: ADXL375
    confidence: asserted
    designators: [U7]
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): confirm the ADXL375 full-scale range and bandwidth from the
      datasheet, with the table cited, and state the full-scale range oApogee
      configures on the ICM-42688-P, also quoted from its datasheet. Then,
      separately, produce the number that justifies this part: the peak
      acceleration of a representative loaded airframe on a C, D, and E motor,
      taken from OpenRocket simulation, so the motor class at which the 6-axis
      IMU saturates is derived rather than asserted. Both halves are needed. A
      full-scale range with no simulated peaks says nothing about which motors
      exceed it, and simulated peaks with no range say nothing about which part
      clips first.
    optional: true
    applies:
      - { tier: link, path: board, qty: 1 }
      - { tier: track, path: board, qty: 1 }
      - { tier: link, path: modules, qty: 1 }
      - { tier: track, path: modules, qty: 1 }
      - { tier: solo, path: board, qty: 1 }
      - { tier: solo, path: modules, qty: 1 }
    why: >
      Optional at every tier, including Solo, because whether a general purpose
      IMU saturates depends on the motor and not on whether the board has a
      radio on it. Tying it to Link put the part behind a capability it has
      nothing to do with, and left the cheapest build, whose entire value is the
      logged flight profile, as the one most likely to record a boost phase that
      is silently wrong. A general purpose IMU has a full-scale range, and boost
      acceleration can exceed it. When an accelerometer saturates it does not report an error, it
      reports its maximum value for as long as the real acceleration is higher.
      The result is a boost phase that looks like a flat plateau sitting exactly
      at the full-scale limit, which is not merely imprecise, it is wrong in a
      way that looks plausible. Integrating that flat top underestimates
      velocity, which propagates into every fused altitude estimate during the
      part of the flight the fusion is most needed. A dedicated high-g part
      exists solely so the boost data means something. The full-scale range and
      the motor class at which the 6-axis IMU actually saturates are recorded in
      the verify note on this part and are deliberately not stated here.
    substitutes:
      - mpn: H3LIS331DL
        manufacturer: STMicroelectronics
        note: >
          Selectable full-scale ranges, cheaper, lower resolution. Adequate for
          detecting and bounding boost acceleration, less good for integrating
          it. TODO(verify): compare the noise floors.
        confidence: asserted
    breakout:
      confidence: unverified
      verify: >
        TODO(verify): identify a currently-stocked ADXL375 breakout and record
        whether it exposes the SPI interface and a usable chip select pin. The
        Board path puts this part on SPI sharing the IMU's bus. If no
        SPI-capable breakout can be sourced, the Modules path does not share the
        Board path's bus assignment, and the "Same electrical design, two ways
        to fabricate it" note at the head of this file must be amended rather
        than quietly left standing.

  # --- Radio --------------------------------------------------------------

  - id: lora
    role: radio
    name: SX1262 LoRa transceiver
    manufacturer: Semtech
    mpn: SX1262
    confidence: asserted
    designators: [U8]
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): the entire range claim. Range is the number readers will
      most want and the number most often lied about in this hobby. It must come
      from a measured ground test and a measured flight, with the antenna type,
      orientation, spreading factor, bandwidth, transmit power, and terrain all
      stated. Publish the disappointing numbers too, specifically the range with
      the rocket on the ground in tall grass after landing, which is the case
      that actually matters for recovery.
    applies:
      - { tier: link, path: board, qty: 1 }
      - { tier: track, path: board, qty: 1 }
    why: >
      LoRa trades data rate for link budget, which is exactly the trade a
      telemetry downlink wants: the packets are small and infrequent, and the
      requirement is that they arrive from far away through a rocket body tube
      at an unfavourable angle.
    region_note: >
      902 to 928 MHz for US builds under FCC Part 15. 863 to 870 MHz for EU and
      UK builds. This is a hardware selection issue as well as a firmware one,
      because the matching network and antenna are tuned per band. See the
      Safety and rules page.
    substitutes: []

  - id: lora_module
    role: radio
    name: SX1262 module
    manufacturer: multiple
    mpn: null
    confidence: unverified
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): select a canonical SX1262 module for the Modules path.
      Candidates to evaluate, none confirmed: Ebyte E22-900M22S, Waveshare
      Core1262, Seeed Wio-SX1262, Ai-Thinker Ra-01SH. Criteria: FCC modular
      approval status, whether the module includes a PA and at what output,
      antenna connector type, mass, and whether the vendor publishes a real
      datasheet rather than a two-page flyer. Modular approval matters: a
      pre-certified module is the difference between Part 15 compliance being
      inherited and being the builder's problem.
    applies:
      - { tier: link, path: modules, qty: 1 }
      - { tier: track, path: modules, qty: 1 }
    why: >
      A pre-certified module removes both the RF layout risk and most of the
      regulatory burden from a first-time builder.
    substitutes: []

  - id: gnss_module
    role: gnss
    name: GNSS receiver module
    manufacturer: multiple
    mpn: null
    confidence: unverified
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): select a canonical GNSS breakout for the Modules path.
      Criteria: exposes UART at 3V3 logic, ships with an antenna usable inside a
      payload bay rather than on a car roof, carries a backup cell or supercap so
      a warm start on the pad is possible, and publishes cold and warm fix times.
      Candidates to evaluate, none confirmed: the u-blox MAX-M10S breakouts sold
      by Adafruit and SparkFun, and the antenna-integrated SAM-M10Q. The chip
      chosen for the Board path does not settle this. A breakout is a different
      product with a different antenna, and the antenna is what decides whether
      a fix survives being inside a cardboard tube.
    applies:
      - { tier: track, path: modules, qty: 1 }
    why: >
      Track is the only tier with a receiver, and on the Modules path it has to
      be a board somebody can solder wires to rather than a QFN.
    substitutes: []

  - id: antenna_rocket
    role: antenna
    name: 902 to 928 MHz antenna, airborne side
    manufacturer: null
    mpn: null
    confidence: unverified
    designators: [J3]
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): choose between a tuned wire monopole cut to a quarter
      wavelength and a flexible PCB antenna, and measure the difference. Publish
      the wire length as a measured, trimmed figure with the ground plane it
      assumes, not as a textbook calculation, because the calculation is not what
      works in a body tube. Also determine whether a carbon fibre or metallic
      airframe blocks the link, and say so plainly if it does.
    applies:
      - { tier: link, path: board, qty: 1 }
      - { tier: track, path: board, qty: 1 }
      - { tier: link, path: modules, qty: 1 }
      - { tier: track, path: modules, qty: 1 }
    why: >
      The antenna is the cheapest part on the board and the one most able to
      ruin the link. It gets its own treatment on the Ground station page.
    substitutes: []

  # --- Position -----------------------------------------------------------

  - id: gnss
    role: gnss
    name: u-blox M10 GNSS receiver
    manufacturer: u-blox
    mpn: MAX-M10S
    confidence: asserted
    designators: [U9]
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): cold start and hot start time to first fix, measured, not
      quoted, because the number that matters is time to fix on a launch rail
      after the pad wait, not the datasheet best case. Also measure whether lock
      is retained through boost once the airborne dynamic model is configured.
    applies:
      - { tier: track, path: board, qty: 1 }
    why: >
      Position for recovery. The value is not the flight track, it is the last
      fix before the signal is lost, which turns a search into a walk.
    gotcha: >
      u-blox receivers ship with a dynamic platform model that assumes ground
      vehicle behaviour and will reject the position solution under rocket
      accelerations, losing lock exactly when it is needed. The airborne model
      must be configured explicitly at startup, and the configuration must be
      saved or reapplied on every boot. This is the single most common reason a
      GNSS-equipped model rocket payload comes back with no track. Also document
      the CoCom velocity and altitude limits, note that they are not reachable at
      the altitudes oApogee targets, and note that they will matter to anyone
      scaling this design up.
    substitutes:
      - mpn: SAM-M10Q
        manufacturer: u-blox
        note: >
          Integrated antenna in the package. Larger and heavier, but removes the
          antenna matching and placement problem entirely, which for a first
          build is usually the right trade. TODO(verify): compare mass and
          measured time to first fix against MAX-M10S with a chip antenna.
        confidence: asserted

