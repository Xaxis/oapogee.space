    verify: >
      Decided: mechanical, a slide or screw switch. The sealed-enclosure
      argument for a reed or Hall sensor does not survive contact with this
      design, because the pod is deliberately vented: it has static ports cut
      through it and must have. That leaves a magnetic switch trading an
      inspectable state for one that can be changed by anything magnetic in a
      range box, and arm state is the thing an operator has to confirm by eye at
      the pad. A slide switch shows its position from across a table.
      TODO(verify): select the specific part and confirm it Then TODO(verify): select the specific part and confirm it
      survives the shake and drop tests without changing state.
    applies:
