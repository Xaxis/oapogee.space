# oApogee bill of materials
#
# Canonical source for every part on the site. The /bom page, the build guide
# part callouts, and the ground station page all render from this file. Do not
# hand-write a parts table in a Markdown page.
#
# ACCURACY CONTRACT
# Every `price_usd` and every `mass_g` in this file is null. That is deliberate,
# not incomplete. The hardware does not exist yet, no unit has been assembled,
# and no cart has been priced. A number appears here only after someone has
# measured it or read it off an invoice, and the corresponding `verify` note
# says exactly what would close it.
#
# Manufacturer part numbers ARE asserted where the silicon is well known and
# stable. Breakout board product numbers and supplier links are NOT asserted,
# because they change, go out of stock, and get revised without notice. Those
# carry `confidence: unverified` and a verify note.

schema_version: 1
updated: 2026-08-11
status: draft
currency: USD

# ---------------------------------------------------------------------------
# Build paths. Same electrical design, two ways to fabricate it.
# ---------------------------------------------------------------------------

paths:
  - id: modules
    name: Modules
    summary: >
      Off-the-shelf breakout boards wired to a carrier or protoboard. Buildable
      today with no PCB fabrication, no reflow, and no stencil.
    tradeoff: >
      Heavier and bulkier than the board path, and every inter-board wire is a
      joint that can fail under boost shock. The mass targets published for the
      Board path do not apply here and must be quoted separately.
    available: true

  - id: board
    name: Board
    summary: >
      The custom oApogee PCB. One part number to order assembled, or a build
      that needs hot air. The passives are 0402 and up and can be done with an
      iron, but the microcontroller is a 60 pin QFN on a 0.4 mm pitch with a
      thermal pad underneath it, the radio is a QFN, and four of the sensors are
      LGA. None of those are hand-solderable in any sense a beginner means, and
      the thermal pads cannot be reached with an iron at all.
    tradeoff: >
      Nothing to build until boards are fabricated, and minimum order quantities
      make a single unit expensive. The layout exists and the fabrication files
      are published, so ordering is a thing somebody could do today. Whether
      they should is the availability note below.
    available: false
    availability_note: >
      TODO(confirm-on-hardware): the layout is complete, routed, and passes
      every geometric check, and the Gerbers, drill files, bill of materials and
      pick and place are published. What is not confirmed is the part that costs
      money to get wrong: 152 signal names are mapped onto footprint pads by
      pin number, and only the microcontroller's 60 pins have been checked
      against a datasheet. The other fourteen packages have not. A wrong pin
      number is invisible in a schematic, invisible in a render, and shows up as
      a board that does not work. Confirm every package by hand before ordering,
      then fly one, then mark this path available.

