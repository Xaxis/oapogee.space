      - { tier: link, path: board, qty: 1 }
      - { tier: track, path: board, qty: 1 }
    why: >
      The high-g accelerometer's supply decoupling. The datasheet asks for a
      tantalum part here and this row specifies ceramic, which is a deliberate
      substitution: a 1 uF ceramic in 0603 is cheaper, smaller, has lower series
