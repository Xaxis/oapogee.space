    manufacturer: multiple
    mpn: null
    confidence: unverified
    designators: [L2]
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): confirm the saturation current exceeds the converter's peak
      switch current at full load, which the TPS63001 datasheet gives as a
