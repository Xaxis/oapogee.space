    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): measure the capacitance actually present on the 3V3 rail at
      3.3 V, not the marked value, and confirm it is above 15 uF. This is the
      one place on the board where DC bias derating changes whether the design
      meets its datasheet or not, so it gets measured rather than assumed.
    applies:
      - { tier: solo, path: board, qty: 1 }
      - { tier: link, path: board, qty: 1 }
      - { tier: track, path: board, qty: 1 }
    why: >
      The buck-boost's output capacitor, and it is a separate line from the
      input capacitor because the datasheet asks for a separate value. SLVS520C
      section 8.2.2.3.2 gives a recommended nominal output capacitance of
      15 uF, with no upper limit and lower ripple for larger values.

      22 uF rather than 15 uF because a marked value is not a delivered value.
      Class II ceramics lose a large fraction of their capacitance under DC
      bias, so a 15 uF part sitting at 3.3 V is not supplying 15 uF, and the
      transmit burst on Link and Track is the largest current step this board
      makes. Buying the margin costs a few cents and one line in this file.
    substitutes: []

  - id: crystal_32m
    role: passive
    name: Crystal, 32 MHz, 10 pF load
    manufacturer: null
    mpn: null
    confidence: unverified
    designators: [Y2]
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): choose a specific part meeting the datasheet's numbers
      below, then weigh and price it. The electrical requirement is closed, the
      part is not.
    datasheet:
      document: Semtech DS.SX1261-2.W.APP, sections 4.1.3 and 3.4
      url: https://cdn.sparkfun.com/assets/6/b/5/1/4/SX1262_datasheet.pdf
      checked: 2026-08-15
      facts: >
        32 MHz, 10 pF nominal load capacitance, ESR 30 ohm typical and 60 ohm
        maximum, drive level at most 100 microwatt.

        No external load capacitors. Section 4.1.3 states that the device "does
        not require the user to set external foot capacitors on the XTAL",
        because it carries programmable capacitors on XTA and XTB, adjustable
        in 0.47 pF steps and impossible to deactivate. Entering STDBY_XOSC
        writes 19.7 pF into both.
    applies:
      - { tier: link, path: board, qty: 1 }
      - { tier: track, path: board, qty: 1 }
    why: >
      The radio's reference. Everything the transceiver does with frequency,
      which is everything it does, is measured against this.

      It is a separate row from the microcontroller's crystal and a different
      frequency, and the pair of them is worth noticing: two crystals on one
      small board is two oscillators to lay out and keep away from each other.

      The pair of load capacitors that normally flanks a crystal is deliberately
      absent here and present on the microcontroller's, which is the sort of
      inconsistency that looks like a mistake and is not. The RP2350 needs
      external capacitors and Raspberry Pi specifies their value; the SX1262
      has them built in and Semtech says adding external ones is wrong.
    substitutes: []

  - id: inductor_15u
    role: passive
    name: Inductor, 15 uH, radio DC-DC
    manufacturer: null
    mpn: null
    confidence: unverified
    designators: [L3]
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): choose a part meeting the four criteria below, then confirm
      the radio actually runs in DC-DC mode rather than falling back to the LDO,
      by measuring transmit current both ways on real hardware. The datasheet
      says the difference is roughly a factor of two, and that is the largest
      single number in this payload's power budget.
    datasheet:
      document: Semtech DS.SX1261-2.W.APP, sections 5.1, 5.1.5 and 13.1.11
      url: https://cdn.sparkfun.com/assets/6/b/5/1/4/SX1262_datasheet.pdf
      checked: 2026-08-15
      facts: >
        15 uH between VREG and DCC_SW, the two pins of the internal buck
        converter. Selection criteria are given rather than a single part:
        shielded, DC resistance at most 2 ohm, rated current at least 100 mA,
        self resonant frequency above 20 MHz. Semtech names Coilcraft LPS3010
        and several TDK MLZ2012 and VLS2010 parts as examples.

        The converter switches at 3.25 MHz in standby and around 5 MHz while
        transmitting, recomputed each time the operating frequency is set.
    applies:
      - { tier: link, path: board, qty: 1 }
      - { tier: track, path: board, qty: 1 }
    why: >
      The radio can run on its internal linear regulator instead, and this
      inductor is what lets it use the switching one. Section 13.1.11 is blunt
      about the cost of not fitting it: "Using only a linear regulator implies
      that the RX or TX current is almost doubled."

      On a payload built around one small cell, where endurance on the pad is
      the thing that decides whether a scrubbed countdown means a lost flight,
      halving the transmit current for one passive is not a close call.
    substitutes: []

  - id: crystal_12m
    role: passive
    name: Crystal, 12 MHz, 30 ppm
    manufacturer: Abracon
    mpn: ABM8-272-T3
    confidence: asserted
    designators: [Y1]
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): weigh and price it with the rest of the order.
    datasheet:
      document: Raspberry Pi, Hardware design with RP2350, chapter 4, Crystal Oscillator
      url: https://pip.raspberrypi.com/documents/RP-008280-DS-hardware-design-with-rp2350.pdf
      checked: 2026-08-15
      facts: >
        12 MHz, 30 ppm frequency tolerance, 10 pF load capacitance, 50 ohm
        maximum ESR. This is the exact part Raspberry Pi recommends for
        original RP2350 designs and the one fitted to the Pico and Pico 2, and
        the guide says the Pico 2 was specifically tuned for it. The chapter
        also states plainly that the internal oscillator's frequency is not
        well defined or controlled, varying by chip, supply voltage and
        temperature, and that applications relying on exact frequencies are
        not possible without an external source, naming USB as the example.
    applies:
      - { tier: solo, path: board, qty: 1 }
      - { tier: link, path: board, qty: 1 }
      - { tier: track, path: board, qty: 1 }
    why: >
      Without this the board is not slow or imprecise, it is unflashable. USB
      needs an accurate reference and USB is the only connector this board has,
      so the crystal is what makes drag-and-drop firmware loading possible, and
      drag-and-drop is why this microcontroller family was chosen at all.

      Not substituted, and that is unusual for a passive on this board. The
      guide is explicit that the circuit is tuned for this crystal's ESR and
      load capacitance at an IOVDD of 3.3 V, that any deviation needs testing
      across temperature, and that changing the crystal parameters risks
      instability in everything clocked from it. This is the one place where
      copying the reference design exactly is the engineering, not a shortcut
      around it.
    substitutes: []

  - id: cap_15p
    role: passive
    name: Capacitor, 15pF, 0402, C0G or NP0
    manufacturer: multiple
    mpn: null
    confidence: unverified
    designators: [C4, C5]
    price_usd: null
    mass_g: null
    verify: >
      TODO(confirm-on-hardware): confirm the crystal starts reliably from cold,
      at the lowest temperature the payload will see, on a board built with the
      final layout. The guide's arithmetic assumes 3 pF of track and pin
      parasitic capacitance, and that assumption is only true if the XIN and
      XOUT traces stay short. It is a measurement about this board, not about
      the part.
    applies:
      - { tier: solo, path: board, qty: 2 }
      - { tier: link, path: board, qty: 2 }
      - { tier: track, path: board, qty: 2 }
    why: >
      The crystal's load capacitors. In series they present half of 15 pF,
      which is 7.5 pF, and the RP2350 hardware design guide adds an assumed
      3 pF of track and pin parasitic capacitance to reach 10.5 pF against the
      crystal's 10 pF target.

      C0G or NP0 rather than the X5R used elsewhere on this board. The cheaper
      dielectrics change capacitance with temperature and with applied voltage,
      and a payload sits on a pad in the sun and then climbs into air that is
      considerably colder. A load capacitance that drifts detunes the
      oscillator, and the failure shows up as a board that sometimes does not
      enumerate over USB.
    substitutes: []

  - id: res_1k_xtal
    role: passive
    name: Resistor, 1k, 0402, crystal damping
    manufacturer: multiple
    mpn: null
    confidence: unverified
    designators: [R13]
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): nothing outstanding on the value. It is Raspberry Pi's,
      given for this crystal at this IO voltage, and this board runs 3.3 V IO.
      Weigh and price it with the other passives.
    applies:
      - { tier: solo, path: board, qty: 1 }
      - { tier: link, path: board, qty: 1 }
      - { tier: track, path: board, qty: 1 }
    why: >
      Damping, in series between XOUT and the crystal. The RP2350 hardware
      design guide gives 1k as the value that stops a 50 ohm ESR crystal being
      overdriven and damaged at an IOVDD of 3.3 V. It is a part whose job is to
      make a working circuit keep working, which is why it is easy to leave off
      a schematic and hard to diagnose afterwards.

      The value is tied to the IO voltage, not just to the crystal. The guide
      notes that below 3.3 V the XIN and XOUT drive current falls, the
      oscillation amplitude drops with it, and a smaller resistor is needed or
      the crystal may not start at all.
    substitutes: []

  - id: cap_10n
    role: passive
    name: Capacitor, 10nF, 0402, X7R
    manufacturer: multiple
    mpn: null
    confidence: unverified
