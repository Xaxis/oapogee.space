      TODO(verify): select a part and then measure what actually matters, which
      is not the datasheet sound pressure level but the distance at which the
      beacon pattern is findable in tall grass on a windy day. Test it by having
      someone hide an active unit in a field. Report that distance.
    applies:
      - { tier: solo, path: board, qty: 1 }
      - { tier: link, path: board, qty: 1 }
      - { tier: track, path: board, qty: 1 }
      - { tier: solo, path: modules, qty: 1 }
      - { tier: link, path: modules, qty: 1 }
      - { tier: track, path: modules, qty: 1 }
