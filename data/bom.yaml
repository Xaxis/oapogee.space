      - { tier: link, path: board, qty: 1 }
      - { tier: track, path: board, qty: 1 }
    why: >
      The microcontroller runs its core from an internal switching regulator,
      and a switching regulator needs an external inductor. It was missing from
      this list for as long as the microcontroller's pinout was a placeholder,
      because the pins that need it were not on the schematic: VREG_LX switches
      into this part, and the far side of it is the core rail. Exactly the kind
      of gap a placeholder hides, since the design looked complete without it.
