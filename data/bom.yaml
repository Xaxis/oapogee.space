  - id: res_100k
    role: passive
    name: Resistor, 100k, 0402
    manufacturer: null
    mpn: null
    confidence: unverified
    designators: [R6, R7, R8]
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): size the battery sense divider against the microcontroller's
      ADC input impedance and its acceptable source impedance, and decide whether
      it needs switching off between readings so it does not drain the cell
      through a long pad wait. 100k is a starting point, not a result.
    applies:
      - { tier: solo, path: board, qty: 3 }
      - { tier: link, path: board, qty: 3 }
      - { tier: track, path: board, qty: 3 }
      - { tier: solo, path: modules, qty: 3 }
      - { tier: link, path: modules, qty: 3 }
      - { tier: track, path: modules, qty: 3 }
    why: >
      One pulls the arming input up so it reads as a level rather than as noise,
      because an input that reads as noise arms a rocket at random. The other two
      divide the cell voltage into the ADC's range: a single cell reaches 4.2 V,
      which is above the 3V3 rail, and the packet format transmits a battery
      voltage that nothing on the board could otherwise measure.
    substitutes: []

