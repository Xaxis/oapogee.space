    substitutes: []

  # --- Arming -------------------------------------------------------------

  - id: arm_switch
    role: arming
    name: Arming switch
    manufacturer: null
    mpn: null
    confidence: unverified
    designators: [SW1]
    price_usd: null
    mass_g: null
    verify: >
      TODO(confirm): mechanical or magnetic. A slide or screw switch is the
      rocketry convention and needs a hole in the pod. A reed or Hall sensor arms
      through the wall with a magnet, which keeps the enclosure sealed apart from
      its static ports, at the cost of a part that can be armed by anything
      magnetic nearby. Decide before the enclosure is designed, because it
      changes the pod. Then TODO(verify): select the specific part and confirm it
      survives the shake and drop tests without changing state.
    applies:
      - { tier: solo, path: board, qty: 1 }
      - { tier: link, path: board, qty: 1 }
      - { tier: track, path: board, qty: 1 }
      - { tier: solo, path: modules, qty: 1 }
      - { tier: link, path: modules, qty: 1 }
      - { tier: track, path: modules, qty: 1 }
    why: >
      The flight state machine's first transition is operator-driven, and without
      an input there is no flight: arming is what starts the pressure reference
      settling and the pre-arm ring buffer. It sits on a GPIO rather than in the
      power path, because oApogee is passive so cutting power arms nothing and
      protects nobody. What the operator needs is to power the payload up, let
      the GNSS get a fix and the barometer settle, and then arm it once the
      rocket is on the rail, which a power switch cannot express.
    substitutes: []

  # --- Passives -------------------------------------------------------------
  #
  # One entry per distinct value, because that is how they are ordered, with the
  # designators each covers. The Board path needs all of them. The Modules path
  # needs only the ones the breakouts do not already carry, which is why the
  # applies lists differ.
  #
  # 0402 is the smallest package a beginner can hand-solder with the tools on
  # this page. Nothing here is smaller.

  - id: res_5k1
    role: passive
    name: Resistor, 5.1k, 0402
    manufacturer: null
    mpn: null
    confidence: unverified
    designators: [R1, R2]
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): price a 0402 resistor assortment against individual reels.
      For a build needing five values, an assortment is almost certainly cheaper
      and is the recommendation this page should make once it is priced.
    applies:
      - { tier: solo, path: board, qty: 2 }
      - { tier: link, path: board, qty: 2 }
      - { tier: track, path: board, qty: 2 }
    why: >
      The two USB-C CC pulldowns. A USB-C sink advertises how much current it
      wants with one 5.1k resistor per CC line, and without them a compliant
      source supplies nothing at all. The board then looks dead on a perfectly
      good cable, which is indistinguishable from the far more common
      charge-only-cable fault and sends a builder chasing the wrong thing.
    substitutes: []

