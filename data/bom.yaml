  - id: cap_1u
    role: passive
    name: Capacitor, 1uF, 0603, X7R
    manufacturer: multiple
    mpn: null
    confidence: unverified
    designators: [C12]
    price_usd: null
    mass_g: null
    verify: >
      TODO(confirm-on-hardware): the ADXL375 datasheet recommends 1 uF on the
      supply and its own specification table was characterised with 10 uF.
      Those are different claims and the document does not reconcile them, so a
      part fitted with 1 uF may not reach the published noise figures. Measure
