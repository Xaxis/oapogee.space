  - id: status_led
    role: indicator
    name: RGB LED, common anode, 3 colour
    manufacturer: multiple
    mpn: null
    confidence: unverified
    designators: [D1]
    price_usd: null
    mass_g: null
    verify: >
      TODO(verify): select a specific part and confirm it is readable in
      daylight from several metres, which is the only test that matters for an
      arm indicator. Then set the three series resistors from its per-colour
      forward voltages, which differ, and are the reason the three values may
      not come out the same.
    applies:
      - { tier: solo, path: board, qty: 1 }
      - { tier: link, path: board, qty: 1 }
      - { tier: track, path: board, qty: 1 }
      - { tier: solo, path: modules, qty: 1 }
      - { tier: link, path: modules, qty: 1 }
      - { tier: track, path: modules, qty: 1 }
    why: >
      Three ordinary LEDs in one package, driven by three pins through three
      resistors, rather than an addressable part driven by one.

      This was specified as an addressable RGB LED, and that is wrong for this
      board. The WS2812 family and its clones want a supply above what this
      payload has: the only rail here is 3V3 and those parts specify a minimum
      higher than that. Running one under its minimum gives an LED that works on
      the bench for the person who tested it and does something else cold, or at
      the bottom of a discharge.

      The related trap is worth writing down because it is the one people meet
      coming the other way: an addressable LED on 5 V needs its data line above
      0.7 of its supply, which a 3V3 pin does not reach. Neither problem exists
      once the part is three plain LEDs.

      The cost is two more pins and two more resistors. The microcontroller has
      pins to spare, and the firmware loses a timing-critical bit-banged
      protocol, which on a payload that is busy during boost is a gain.

      Arm state has to be readable from a few metres while the rocket is on the
      pad and you are walking back. That is the whole requirement.
    substitutes: []

# ---------------------------------------------------------------------------
# Ground station. A second, separate bill of materials. Tier Link and Track are
# not usable without one, and a quoted Link price that omits it is dishonest.
# ---------------------------------------------------------------------------

ground_station:
  summary: >
    A matching SX1262 receiver on the same MCU family, connected by USB to a
    laptop or phone. The display layer runs in the browser over WebSerial so
    there is nothing to install on the flight line.
  status: proposed
  approval_note: >
    Decided: WebSerial, with the browser requirement stated prominently and a
    documented serial terminal fallback. It needs no installation, which is the
    right answer for a club field where six people want to watch, and it is not
    supported in Safari or on iOS. The alternative rejected was a native app per
    platform, which
    nobody will install. A third option is a small local server the user runs
    once. Recommend WebSerial with an explicit, prominently stated browser
    requirement, and a plain serial terminal fallback documented for everyone
    else.
  parts:
    - id: gs_mcu
      name: RP2350 or RP2040 development module
      same_as: mcu_module
      qty: 1
    - id: gs_radio
      name: SX1262 module
      same_as: lora_module
      qty: 1
    - id: gs_antenna
      name: 902 to 928 MHz antenna, ground side
      qty: 1
      confidence: unverified
      price_usd: null
      verify: >
        TODO(verify): the ground antenna is where link budget is cheapest to buy,
        because mass does not matter on the ground. Compare a quarter wave whip
        against a small yagi and publish both measured ranges, so a reader can
        decide whether the yagi is worth carrying.
    - id: gs_enclosure
      name: 3D printed ground station case
      qty: 1
      confidence: unverified
      price_usd: null
      verify: "TODO(verify): print time and filament mass once the model exists."

# ---------------------------------------------------------------------------
# Tools. What a builder needs that is not on the parts list. Split into what is
# genuinely required and what merely helps, because a beginner reading a long
# tool list decides the project is not for them.
# ---------------------------------------------------------------------------

tools:
  required:
    - name: Temperature-controlled soldering iron with a fine conical or chisel tip
      note: >
        A fixed-temperature iron will work for the Modules path. It is not
        adequate for the Board path.
    - name: Leaded or lead-free solder, 0.5 to 0.8 mm
    - name: Flux, no-clean, in a pen or syringe
      note: >
        The single highest-value item on this list for a beginner. Most bad
        joints are a flux problem, not a skill problem.
    - name: Fine tweezers
    - name: Flush cutters
    - name: Multimeter with continuity and DC volts
      note: >
        Required, not optional. The build guide has a continuity checkpoint
        before first power-on, and skipping it is how a reversed battery
        connector becomes a dead board.
    - name: LiPo-safe charging container or a metal tin
      note: >
        Safety and rules requires charging on a hard non-flammable surface with
        the room occupied. This is what makes that possible, so it is not
        optional and it is not a 3D printing accessory.
    - name: USB-C cable, data capable
      note: >
        Charge-only USB-C cables are common and will make a working board look
        broken. This has its own troubleshooting entry.
    - name: Digital calipers
      note: Needed to fit the pod to a specific body tube diameter.
    - name: Small drill bits and a pin vice
      note: For static ports. See the Mounting page for sizing.
  recommended:
    - name: Solder wick and a solder sucker
    - name: Helping hands or a small vice
    - name: Illuminated magnifier or a USB microscope
    - name: Isopropyl alcohol and a stiff brush
    - name: Scale accurate to 0.1 g
      note: >
        Strongly recommended. You cannot do a stability check without knowing the
        payload mass, and guessing it defeats the purpose.
  board_path:
    - name: Hot air station, hotplate, or reflow oven
      note: >
        Only for the Board path, and not optional there. The microcontroller and
        the radio are QFNs with thermal pads on their undersides, and a pad
        under a chip cannot be reached with an iron. The Modules path needs none
        of this, which is most of why it exists.
    - name: Solder paste and a stencil
      note: >
        Ordered with the board from the same fab. Paste has a shelf life and
        wants refrigeration, so buy it when you are ready to build rather than
        with the parts.
    - name: Flux-removing solvent and a brush
      note: >
        Paste leaves more residue than wire solder, and residue under a QFN is
        where a leakage path lives.

  fabrication:
    - name: 3D printer, or access to a print service
      note: >
        Required for the mounting hardware in both form factors. FDM in PLA or
        PETG is sufficient. TODO(verify): confirm PLA survives a black airframe
        sitting on a pad in summer sun, and if it does not, say so and recommend
        PETG.
